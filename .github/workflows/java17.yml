name: Java 17 Maven verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run JUnit 5 tests and build executable jar
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Run default demonstration
        run: java -jar target/visitor-filesystem-1.0.0.jar
      - name: Change search configuration
        run: java -jar target/visitor-filesystem-1.0.0.jar .md 128
